<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk atau daftar | Pathora</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/chat.css">
<link rel="stylesheet" href="assets/css/masuk.css">
</head>
<body class="au-pg chat-mode">
<div class="au-bg" aria-hidden="true"></div>
<div id="nav"></div>
<main class="au">
  <section class="au-l">
    <h1 id="sideH"></h1>
    <p id="sideP"></p>
    <ul id="sideL"></ul>
  </section>
  <section class="au-card" aria-labelledby="h1">
    <div class="au-seg" role="tablist" aria-label="Masuk atau daftar">
      <button type="button" role="tab" id="tMasuk">Masuk</button>
      <button type="button" role="tab" id="tDaftar">Daftar</button>
    </div>
    <h2 id="h1"></h2>
    <p class="au-sub" id="sub"></p>
    <div class="au-chips" role="group" aria-label="Jenis akun">
      <button type="button" id="rTraveler">Traveler</button>
      <button type="button" id="rHost">Host lokal</button>
    </div>
    <div class="au-err" id="err" role="alert"></div>
    <form class="au-f" id="f" novalidate>
      <div id="fName"><label for="name">Nama lengkap</label><input id="name" autocomplete="name"></div>
      <div class="au-hf" id="hostF">
        <div><label for="community">Nama komunitas atau usaha</label><input id="community" placeholder="Contoh: Kelompok Tani Bakau Pesanggaran"></div>
        <div><label for="place">Lokasi kegiatan</label><input id="place" placeholder="Desa dan kabupaten"></div>
        <div><label for="phone">Nomor WhatsApp</label><input id="phone" inputmode="tel" placeholder="08xxxxxxxxxx"></div>
      </div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="nama@email.com"></div>
      <div><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password" placeholder="Minimal 8 karakter"></div>
      <button class="au-btn pri" id="submit" type="submit">Masuk</button>
    </form>
    <div class="au-sep">atau</div>
    <button class="au-btn gh" id="demo" type="button"></button>
    <p class="au-sw" id="switch"></p>
    <a class="au-guest" id="guest" href="trip">Lanjutkan tanpa akun</a>
  </section>
</main>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/data-en.js"></script>
<script src="assets/js/en.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function(){
  const { ic } = PA; const q = new URLSearchParams(location.search);
  const st = { role: q.get('role') === 'host' ? 'host' : 'traveler', mode: q.get('mode') === 'daftar' ? 'daftar' : 'masuk' };
  const next = q.get('next');
  const $ = (id) => document.getElementById(id);
  const COPY = {
    traveler: { h: 'Rencanakan perjalanan alam dan budaya Bali.', p: 'Susun trip bersama asisten AI, ajukan ke host lokal, dan kumpulkan stempel di Paspor Alam.', l: ['Jadwal disesuaikan cuaca, keramaian, dan hari raya', 'Kalender, pengajuan ke host, dan pembayaran di satu tempat', 'Trip sendiri atau bareng teman, biaya dibagi otomatis'] },
    host: { h: 'Bagikan kegiatan dan keahlian lokalmu.', p: 'Studio Host membantu komunitas lokal menerima tamu dengan jadwal dan kuota yang kamu atur sendiri.', l: ['Kamu yang menentukan jadwal, kuota, dan hari tutup', 'Tamu baru membayar setelah kamu menyetujui permintaannya', 'Komisi 12 persen per pesanan lunas, tanpa biaya bulanan'] }
  };
  function paint(){
    const c = COPY[st.role], reg = st.mode === 'daftar';
    $('sideH').textContent = c.h; $('sideP').textContent = c.p;
    $('sideL').innerHTML = c.l.map(function(t){ return '<li><i>' + ic('check', 12) + '</i><span>' + t + '</span></li>'; }).join('');
    $('tMasuk').className = reg ? '' : 'on'; $('tDaftar').className = reg ? 'on' : '';
    $('tMasuk').setAttribute('aria-selected', String(!reg)); $('tDaftar').setAttribute('aria-selected', String(reg));
    $('rTraveler').className = st.role === 'traveler' ? 'on' : ''; $('rHost').className = st.role === 'host' ? 'on' : '';
    $('rTraveler').setAttribute('aria-pressed', String(st.role === 'traveler')); $('rHost').setAttribute('aria-pressed', String(st.role === 'host'));
    $('h1').textContent = reg ? (st.role === 'host' ? 'Daftar sebagai host' : 'Buat akun Pathora') : (st.role === 'host' ? 'Masuk ke Studio Host' : 'Masuk ke Pathora');
    $('sub').textContent = reg ? 'Hanya butuh satu menit.' : 'Selamat datang kembali.';
    $('fName').style.display = reg ? '' : 'none'; $('hostF').style.display = reg && st.role === 'host' ? 'grid' : 'none';
    $('submit').textContent = reg ? (st.role === 'host' ? 'Daftarkan host' : 'Buat akun') : 'Masuk';
    $('switch').innerHTML = reg ? 'Sudah punya akun? <a href="#" id="sw">Masuk</a>' : 'Belum punya akun? <a href="#" id="sw">Daftar</a>';
    $('sw').onclick = function(e){ e.preventDefault(); setMode(reg ? 'masuk' : 'daftar'); };
    $('demo').textContent = st.role === 'host' ? 'Coba dengan akun host demo' : 'Coba dengan akun traveler demo';
    $('guest').style.display = st.role === 'traveler' ? '' : 'none';
    $('pw').autocomplete = reg ? 'new-password' : 'current-password';
  }
  function setMode(m){ st.mode = m; err(''); paint(); }
  function setRole(r){ st.role = r; err(''); paint(); }
  $('tMasuk').onclick = function(){ setMode('masuk'); }; $('tDaftar').onclick = function(){ setMode('daftar'); };
  $('rTraveler').onclick = function(){ setRole('traveler'); }; $('rHost').onclick = function(){ setRole('host'); };
  function lokalCek(o){
    if (!(o.name || '').trim()) return 'Nama wajib diisi.';
    if (!/^\S+@\S+\.\S+$/.test((o.email || '').trim())) return 'Format email belum sesuai.';
    if ((o.password || '').length < 8) return 'Kata sandi minimal 8 karakter.';
    if (o.role === 'host' && !(o.community || '').trim()) return 'Nama komunitas atau usaha wajib diisi.';
    return '';
  }
  function err(m){ const e = $('err'); e.textContent = m; e.classList.toggle('show', !!m); }
  function done(a){
    const dest = a.role === 'host' ? 'host' : (next && !/^(https?:|\/\/|javascript:)/i.test(next) ? next : 'trip');
    location.href = dest;
  }
  $('f').addEventListener('submit', async function(e){
    e.preventDefault(); err('');
    const o = { role: st.role, name: $('name').value, email: $('email').value, password: $('pw').value, community: $('community').value, place: $('place').value, phone: $('phone').value };
    const lokal = function(){ return st.mode === 'daftar' ? PAUTH.signup(o) : PAUTH.login(o.email, o.password); };
    if (st.mode === 'daftar') { const cek = lokalCek(o); if (cek) return err(cek); }
    let r;
    if (window.PAPI && PAPI.enabled()) {
      /* Akun disimpan di server Pathora. Kalau server tidak bisa dihubungi, akun tetap dibuat di browser ini. */
      const btn = $('submit'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Memproses...';
      const rb = await PAPI.akun(st.mode, o);
      btn.disabled = false; btn.textContent = label;
      if (rb.error) return err(rb.error);
      if (rb.ok) { r = { ok: PAUTH.adopt(rb.ok) }; if (o.phone) PAUTH.update({ phone: o.phone.trim() }); }
      else r = lokal();
    } else r = lokal();
    if (r.error) return err(r.error);
    if (r.ok.role !== st.role) { PAUTH.logout(); const was = r.ok.role; st.role = was; paint(); return err(was === 'host' ? 'Email ini terdaftar sebagai host. Pilihan sudah dipindah ke Host lokal, silakan coba masuk lagi.' : 'Email ini terdaftar sebagai traveler. Pilihan sudah dipindah ke Traveler, silakan coba masuk lagi.'); }
    done(r.ok);
  });
  $('demo').onclick = function(){ done(PAUTH.demo(st.role).ok); };
  UI.mountNav(null, true);
  paint();
})();
</script>
</body>
</html>
