<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>   Pathora — Try Ask AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --earth:#513229; --dice:#F4F1E2; --blue:#D8EBF9; --bay:#FCE6B7; --vinnie:#D7D4B1;
    --paper:#FBF9F0; --white:#FFFDF6; --ink-2:#7A5E55; --line:rgba(81,50,41,.14);
    --ok:#3F5A33; --ok-bg:rgba(124,154,107,.18);
    --serif:'Fraunces', Georgia, serif;
    --sans:'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
    /* spacing scale: 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96 */
    --r-s:10px; --r-m:16px; --r-l:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--dice)}
  body{color:var(--earth);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--earth);outline-offset:3px}
  .serif{font-family:var(--serif);font-weight:500}
  .muted{color:var(--ink-2)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:600;border:1.5px solid var(--earth);white-space:nowrap}
  .btn-primary{background:var(--earth);color:var(--dice)}
  .btn-ghost{background:transparent;color:var(--earth)}
  .btn-soft{background:var(--paper);border-color:var(--line);color:var(--earth)}
  .btn-sm{height:38px;padding:0 16px;font-size:14px}
  .btn-full{width:100%}
  .link{font-weight:600;text-decoration:underline;text-underline-offset:4px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:32px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
  .p-quiet{background:var(--blue)} .p-mid{background:var(--bay)} .p-busy{background:var(--earth);color:var(--dice)} .p-local{background:var(--vinnie)} .p-line{border:1px solid var(--line);background:var(--white)}

  .logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .logo-mark{display:flex;gap:2px;height:24px}
  .logo-mark span{width:5px;border-radius:2px}

  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .input{width:100%;height:48px;border:1px solid var(--line);background:var(--white);border-radius:var(--r-s);padding:0 14px;font-size:15px}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:var(--earth);color:var(--dice);padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .chat{max-width:780px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
  .thread{flex:1;display:flex;flex-direction:column;gap:28px;padding-bottom:32px}
  .empty{text-align:center;padding:48px 0 16px}
  .empty h2{font-family:var(--serif);font-weight:500;font-size:28px}
  .empty p{color:var(--ink-2);margin-top:8px}
  .msg-q{align-self:flex-end;max-width:80%;border-radius:22px 22px 6px 22px;padding:14px 20px;font-size:16px}
  .q-t{background:var(--blue)} .q-b{background:var(--bay)}
  .msg-a{display:flex;flex-direction:column;gap:16px}
  .msg-a h3{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.25}
  .msg-a .txt{color:var(--ink-2);font-size:16px}
  .places{display:flex;flex-direction:column;gap:12px}
  .pl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px 24px}
  .pl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .pl h4{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.25}
  .pl small{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
  .pl .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pl details{margin-top:12px;font-size:14.5px}
  .pl summary{cursor:pointer;font-weight:600;color:var(--ink-2);list-style:none}
  .pl summary::-webkit-details-marker{display:none}
  .pl details p{margin-top:6px;color:var(--ink-2)}
  .facts{display:flex;gap:12px;flex-wrap:wrap}
  .fact{flex:1;min-width:150px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
  .fact b{display:block;font-family:var(--serif);font-weight:500;font-size:26px}
  .fact span{font-size:14px;color:var(--ink-2)}
  .basis{font-size:13.5px;color:var(--ink-2)}
  .follow{display:flex;gap:8px;flex-wrap:wrap}
  .follow button,.sugg button{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px}
  .typing{display:flex;gap:6px;padding:8px 0}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);opacity:.4;animation:b 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{50%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .typing i{animation:none;opacity:.8} }
  .composer-wrap{position:sticky;bottom:0;background:var(--dice);padding:16px 0 24px}
  .sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .composer{display:flex;gap:12px;align-items:flex-end;background:var(--white);border:1.5px solid var(--earth);border-radius:24px;padding:12px 12px 12px 22px}
  .composer textarea{flex:1;border:0;background:transparent;resize:none;font-size:16px;line-height:1.5;padding:10px 0;min-height:44px;max-height:160px;outline:none}
  .send{flex:none;width:46px;height:46px;border-radius:50%;background:var(--earth);display:flex;align-items:center;justify-content:center}
  .send::after{content:"";width:10px;height:10px;border-top:2px solid var(--dice);border-right:2px solid var(--dice);transform:rotate(-45deg) translate(-1px,2px)}
  .send:disabled{opacity:.4}
  .quota{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
  .quota a{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--earth)}

  .gbar{display:flex;justify-content:space-between;align-items:center;height:80px;padding:0 40px;border-bottom:1px solid var(--line);background:var(--paper)}
  .gbar .r{display:flex;align-items:center;gap:16px}
  .gtag{font-size:14px;color:var(--ink-2)}
  .gwrap{padding:40px 24px 0}
  .head{text-align:center;margin-bottom:8px}
  .head h1{font-family:var(--serif);font-weight:500;font-size:36px}
  .head p{color:var(--ink-2);margin-top:6px}
  @media (max-width:640px){ .gbar{padding:0 16px} .gtag{display:none} }

</style>
</head>
<body>

<header class="gbar"><a href="01-landing.html" class="logo"><span class="logo-mark" aria-hidden="true"><span style="background:var(--earth)"></span><span style="background:var(--vinnie)"></span><span style="background:var(--bay)"></span><span style="background:var(--blue)"></span></span>   Pathora</a><div class="r"><span class="gtag">Trying without an account</span><a href="02d-login.html">Log in</a><a href="02b-signup-traveler.html" class="btn btn-primary btn-sm">Sign up free</a></div></header>
<main class="gwrap">
  <div class="head"><h1>Ask AI about Bali</h1><p>Try 5 questions. Sign up free to save places to a trip.</p></div>

  <div class="chat">
    <div class="thread" id="thread" aria-live="polite">
      <div class="empty" id="empty"><h2>What would you like to know?</h2><p>Try one of these, or type your own question.</p></div>
    </div>
    <div class="composer-wrap">
      <div class="sugg" id="sugg"><button type="button" onclick="ask(this.textContent)">A quiet waterfall near Ubud on Saturday?</button><button type="button" onclick="ask(this.textContent)">Rice terraces without the crowds?</button><button type="button" onclick="ask(this.textContent)">Where to eat near Ubud?</button></div>
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Ask about places, times or food…" aria-label="Your question"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send"></button>
      </form>
      <div class="quota"><span id="quota">5 of 5 questions left today</span><a href="02b-signup-traveler.html">Sign up free for 15 a day</a></div>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>




</body></html>
