<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun dan langganan — Pathora</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
<style>
.acc{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:20px}
.plan{border:1px solid var(--line-2);border-radius:var(--r-lg);padding:26px;background:var(--paper);display:flex;flex-direction:column;gap:16px}
.plan.cur{border-color:var(--olive);box-shadow:0 0 0 2px rgba(95,110,58,.25)}
.plan .p{font-size:32px;font-weight:800;letter-spacing:-.02em}.plan .p small{font-size:14px;font-weight:500;color:var(--ink-3)}
@media(max-width:860px){.acc{grid-template-columns:1fr}}
</style>
</head>
<body class="mesh">
<div id="nav"></div>
<main class="wrap" id="root"></main>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  const { ic } = PA, esc = UI.esc;
  const a = PAUTH.current();
  if (!a) { location.replace('masuk.html?next=akun.html'); return; }
  if (a.role === 'host') { location.replace('host.html'); return; }
  UI.mountNav('', 'dark'); UI.mountFooter();
  const root = document.getElementById('root');
  function render(){
    const u = PAUTH.current(), plus = u.plan === 'plus';
    const q = PS.get().seen.q, used = q && q.d === PD.D.today() ? q.n : 0;
    root.innerHTML = '<div class="page-h"><span class="eyebrow">Akun</span><h1>Akun dan langganan</h1><p>Kelola profil dan paket Anda.</p></div>' +
      '<section class="card" style="padding:24px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span class="av av-lg" style="background:var(--olive);width:60px;height:60px;font-size:20px">' + esc(PS.me().ini) + '</span><div style="flex:1;min-width:200px"><b style="font-size:18px">' + esc(u.name) + '</b><div class="muted">' + esc(u.email) + '</div></div><span class="badge ' + (plus ? 'b-ok' : '') + '"><i></i>' + (plus ? 'Pathora Plus' : 'Paket gratis') + '</span></section>' +
      '<div class="acc"><div class="plan' + (!plus ? ' cur' : '') + '"><div><b style="font-size:20px">Gratis</b><div class="muted" style="font-size:14px">Untuk perencanaan sesekali</div></div><div class="p">Rp0<small> selamanya</small></div><ul class="checklist"><li>' + ic('check', 18) + '5 pertanyaan ke asisten AI per hari</li><li>' + ic('check', 18) + 'Kalender trip dan pengajuan ke host</li><li>' + ic('check', 18) + 'Pembagian biaya dan Paspor Alam</li></ul>' +
      (!plus ? '<div class="badge" style="align-self:flex-start">Paket Anda saat ini · terpakai ' + used + ' dari 5 hari ini</div>' : '<button class="btn btn-line" id="down">Kembali ke paket gratis</button>') + '</div>' +
      '<div class="plan' + (plus ? ' cur' : '') + '"><div><b style="font-size:20px">Pathora Plus</b><div class="muted" style="font-size:14px">Untuk perencana yang rutin bepergian</div></div><div class="p">Rp49.000<small> per bulan</small></div><ul class="checklist"><li>' + ic('check', 18) + 'Pertanyaan tanpa batas ke asisten AI</li><li>' + ic('check', 18) + 'Trip dan anggota tanpa batas</li><li>' + ic('check', 18) + 'Prakiraan keramaian untuk tanggal pilihan Anda</li></ul>' +
      (plus ? '<div class="badge b-ok" style="align-self:flex-start"><i></i>Paket Anda saat ini</div>' : '<button class="btn btn-primary" id="up">Mulai uji coba gratis 7 hari</button>') + '</div></div>' +
      '<p class="faint" style="font-size:13px;margin:0 0 36px">Simulasi: tidak ada pembayaran yang diproses. Pada versi sesungguhnya, Anda diingatkan sebelum penagihan pertama dan dapat berhenti kapan saja.</p>' +
      '<section class="card" style="padding:24px;margin-bottom:70px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap"><div><b>Data di browser ini</b><div class="muted" style="font-size:14px">Trip, obrolan, dan pesanan tersimpan lokal.</div></div><span style="display:flex;gap:8px"><button class="btn btn-danger btn-sm" id="rs">Hapus data trip</button><button class="btn btn-line btn-sm" id="out">Keluar</button></span></section>';
    const up = document.getElementById('up'); if (up) up.onclick = function(){ PAUTH.update({ plan:'plus' }); UI.toast('Pathora Plus aktif'); render(); };
    const dn = document.getElementById('down'); if (dn) dn.onclick = function(){ PAUTH.update({ plan:'gratis' }); UI.toast('Kembali ke paket gratis'); render(); };
    document.getElementById('rs').onclick = function(){ PS.reset(); UI.toast('Data trip dihapus'); };
    document.getElementById('out').onclick = function(){ PAUTH.logout(); location.href = 'index.html'; };
  }
  render();
})();
</script>
</body>
</html>
