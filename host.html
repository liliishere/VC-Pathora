<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Host — Pathora</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="mesh">
<div id="nav"></div>
<div class="studio">
  <aside class="side" id="side"></aside>
  <main class="s-main" id="main"></main>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  const { A, byId, D, rp, weatherFor, crowdFor, moonFor, isClosed, seatsLeft, uid } = PD, { ic } = PA, esc = UI.esc;
  const acct = PAUTH.current();
  if (!acct || acct.role !== 'host') { location.replace('masuk.html?role=host&next=host.html'); return; }
  UI.mountNav('', 'dark', 'host');
  const HOST = acct.community || acct.name;
  const MY = A.filter(function(a){ return a.host.name === HOST; }).map(function(a){ return a.id; });
  const COMM = 0.12;
  const BASE = [['Mei', 2100000], ['Jun', 2650000], ['Jul', 3400000], ['Agu', 3900000], ['Sep', 3100000]];
  let view = new URLSearchParams(location.search).get('v') || 'ringkasan';
  let calMonth = '2026-11-01';
  const NAV = [['ringkasan','Ringkasan','home'],['permintaan','Permintaan','bell'],['kegiatan','Kegiatanku','list'],['kuota','Kuota dan kalender','calendar'],['pendapatan','Pendapatan','chart'],['profil','Profil','user']];

  function requests(){
    const s = PS.get();
    const fromTrips = s.items.filter(function(i){ return MY.indexOf(i.actId) >= 0 && i.status === 'diajukan'; }).map(function(i){ const m = PS.member(i.by); return { src:'item', uid:i.uid, name:(m ? m.name : 'Traveler') + (i.people > 1 ? ' dan rombongan' : ''), actId:i.actId, date:i.date, people:i.people, status:'baru' }; });
    const demo = s.reqs.filter(function(r){ return r.status === 'baru' && MY.indexOf(r.actId) >= 0; }).map(function(r){ return Object.assign({ src:'demo' }, r); });
    return fromTrips.concat(demo);
  }
  function income(){
    const s = PS.get();
    const live = s.payouts.filter(function(p){ return MY.indexOf(p.actId) >= 0; }).reduce(function(t,p){ return t + p.amount; }, 0);
    const approvedDemo = s.reqs.filter(function(r){ return r.status === 'disetujui'; }).reduce(function(t,r){ return t + byId[r.actId].price * r.people; }, 0);
    const has = MY.length > 0; const oct = (has ? 3600000 : 0) + live + approvedDemo;
    return { months: (has ? BASE : BASE.map(function(m){ return [m[0], 0]; })).concat([['Okt', oct]]), cur: oct, live: live + approvedDemo };
  }
  function side(){
    const n = requests().length;
    document.getElementById('side').innerHTML = '<div class="me"><span class="av av-lg" style="background:var(--olive)">' + esc(HOST.split(' ').map(function(x){ return x[0]; }).join('').slice(0,2).toUpperCase()) + '</span><div><b style="font-size:14px;line-height:1.3;display:block">' + esc(HOST) + '</b><small>Studio Host</small></div></div>' +
      NAV.map(function(x){ return '<button class="' + (x[0] === view ? 'on' : '') + '" data-v="' + x[0] + '">' + ic(x[2], 18) + x[1] + (x[0] === 'permintaan' && n ? '<span class="cnt">' + n + '</span>' : '') + '</button>'; }).join('') +
      '<div style="margin-top:auto;padding:12px;font-size:12px;color:rgba(244,241,226,.55)">Seluruh angka pada halaman ini adalah data contoh.</div>';
  }
  document.getElementById('side').addEventListener('click', function(e){ const b = e.target.closest('[data-v]'); if (b) { view = b.dataset.v; render(); window.scrollTo(0,0); } });

  function reqRow(r){
    const a = byId[r.actId]; const left = seatsLeft(a, r.date, PS.get().items);
    return '<div class="req"><span class="av av-lg" style="background:var(--bamboo)">' + esc(r.name.split(' ').map(function(x){ return x[0]; }).join('').slice(0,2)) + '</span><div class="i"><b>' + esc(r.name) + '</b><small>' + esc(a.short) + ' · ' + D.long(r.date) + ' · ' + r.people + ' orang · ' + rp(a.price * r.people) + '</small><small style="display:block;margin-top:2px">' + (left === 0 ? '<span style="color:#86320f">Kuota penuh pada tanggal ini</span>' : left < r.people ? '<span style="color:#86320f">Sisa ' + left + ' kursi, kurang dari jumlah yang diminta</span>' : 'Kuota mencukupi, sisa ' + left + ' kursi') + '</small></div><div style="display:flex;gap:8px"><button class="btn btn-danger btn-sm" data-rj="' + r.uid + '" data-src="' + r.src + '">Tolak</button><button class="btn btn-primary btn-sm" data-ap="' + r.uid + '" data-src="' + r.src + '">Setujui</button></div></div>';
  }
  function decide(uidv, src, ok){
    if (src === 'item') { PS.setStatus(uidv, ok ? 'disetujui' : 'ditolak'); }
    else PS.update(function(s){ const r = s.reqs.find(function(x){ return x.uid === uidv; }); if (r) r.status = ok ? 'disetujui' : 'ditolak'; });
    UI.toast(ok ? 'Disetujui. Tamu sekarang bisa membayar.' : 'Ditolak. Tamu akan ditawari alternatif.');
  }

  function vRingkasan(){
    const s = PS.get(), inc = income(), rq = requests();
    const up = s.items.filter(function(i){ return MY.indexOf(i.actId) >= 0 && (i.status === 'disetujui' || i.status === 'lunas'); });
    return '<h1>Selamat datang, ' + esc(HOST) + '</h1><p class="sub">Ringkasan aktivitas Anda. Tamu baru dikenai biaya setelah Anda menyetujui permintaan.</p>' +
      '<div class="kpis"><div class="kpi"><small>Permintaan baru</small><b>' + rq.length + '</b></div><div class="kpi"><small>Pesanan terkonfirmasi</small><b>' + up.length + '</b></div><div class="kpi"><small>Bersih bulan ini</small><b>' + rp(inc.cur * (1 - COMM)) + '</b></div></div>' +
      '<section class="pane" style="margin-bottom:22px"><div class="pane-h"><h2>Menunggu keputusan Anda</h2>' + (rq.length ? '<button class="btn btn-ghost btn-sm" data-v="permintaan">Lihat semua</button>' : '') + '</div><div class="pane-b">' + (rq.length ? rq.slice(0,3).map(reqRow).join('') : '<p class="muted">Tidak ada permintaan baru saat ini.</p>') + '</div></section>' +
      '<section class="pane"><div class="pane-h"><h2>Pendapatan 6 bulan</h2><button class="btn btn-ghost btn-sm" data-v="pendapatan">Detail</button></div><div class="pane-b">' + chart(inc) + '</div></section>';
  }
  function chart(inc){
    const mx = Math.max.apply(null, inc.months.map(function(m){ return m[1]; }));
    return '<div class="chart">' + inc.months.map(function(m, i){ const last = i === inc.months.length - 1; return '<div class="col"><b>' + (m[1]/1e6).toFixed(1).replace('.', ',') + ' jt</b><i style="height:' + Math.round(m[1]/mx*130) + 'px;' + (last ? '' : 'background:var(--sand)') + '"></i><small>' + m[0] + '</small></div>'; }).join('') + '</div>';
  }
  function vPermintaan(){
    const rq = requests();
    const done = PS.get().reqs.filter(function(r){ return r.status !== 'baru' && MY.indexOf(r.actId) >= 0; });
    return '<h1>Permintaan</h1><p class="sub">Setujui atau tolak setiap permintaan. Jika ditolak, tamu otomatis ditawari alternatif oleh Pathora.</p>' +
      (rq.length ? rq.map(reqRow).join('') : '<div class="empty card"><h3>Seluruh permintaan sudah ditangani</h3><p style="margin-top:6px">Permintaan baru dari tamu akan tampil di sini.</p></div>') +
      (done.length ? '<h3 style="margin:34px 0 12px;font-size:16px">Riwayat keputusan</h3>' + done.map(function(r){ return '<div class="req"><div class="i"><b>' + esc(r.name) + '</b><small>' + esc(byId[r.actId].short) + ' · ' + D.long(r.date) + ' · ' + r.people + ' orang</small></div><span class="badge ' + (r.status === 'disetujui' ? 'b-ok' : 'b-bad') + '"><i></i>' + (r.status === 'disetujui' ? 'Disetujui' : 'Ditolak') + '</span></div>'; }).join('') : '');
  }
  function vKegiatan(){
    const drafts = PS.get().seen.hostDrafts || [];
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>Kegiatanku</h1><p class="sub">Kegiatan yang tampil kepada tamu di halaman Jelajahi.</p></div><button class="btn btn-dark" id="newAct">' + ic('plus', 16) + ' Tambah kegiatan</button></div>' +
      MY.map(function(id){ const a = byId[id]; return '<div class="order"><span class="th" style="width:120px;height:92px">' + PA.photo(a) + '</span><div class="i"><h3>' + esc(a.name) + '</h3><p>' + rp(a.price) + ' per orang · ' + a.dur.toString().replace('.', ',') + ' jam · maks. ' + a.cap + ' orang · sesi ' + a.times.join(', ') + '</p><div style="margin-top:8px"><span class="badge b-ok"><i></i>Tayang</span></div></div><a class="btn btn-line btn-sm" href="kegiatan.html?id=' + id + '">Lihat sebagai tamu</a></div>'; }).join('') +
      drafts.map(function(d){ return '<div class="order"><div class="i"><h3>' + esc(d.name) + '</h3><p>' + rp(d.price) + ' per orang · ' + esc(d.place) + '</p><div style="margin-top:8px"><span class="badge b-mid"><i></i>Menunggu peninjauan Pathora</span></div></div></div>'; }).join('');
  }
  function vKuota(){
    if (!MY.length) return '<h1>Kuota dan kalender</h1><p class="sub">Kalender kuota tersedia setelah Anda memiliki kegiatan yang tayang.</p><div class="empty card"><h3>Belum ada kegiatan tayang</h3><p style="margin:8px 0 16px">Tambahkan kegiatan pertama Anda. Setelah ditinjau tim Pathora, kegiatan tampil di Jelajahi dan kuotanya dapat diatur di sini.</p><button class="btn btn-dark" data-v="kegiatan">Tambah kegiatan</button></div>';
    const a = byId[MY[0]], s = PS.get(); const first = D.parse(calMonth); const off = (first.getDay() + 6) % 7; const gs = D.add(calMonth, -off);
    let cells = ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
    for (let i = 0; i < 42; i++){ const d = D.add(gs, i), dt = D.parse(d); if (i >= 35 && dt.getMonth() !== first.getMonth()) break;
      const cl = isClosed(a, d, s.hostClosed), manual = s.hostClosed[a.id] && s.hostClosed[a.id].indexOf(d) >= 0, left = seatsLeft(a, d, s.items), mn = moonFor(d);
      cells += '<button class="cell qcell' + (cl ? ' closed' : '') + (dt.getMonth() !== first.getMonth() ? ' out' : '') + '" data-q="' + d + '"><span class="dn"><span>' + dt.getDate() + '</span>' + (mn ? ic('moon', 12) : '') + '</span>' + (cl ? '<span style="font-size:11px;font-weight:700;color:#86320f">' + (manual ? 'Ditutup' : 'Tutup adat') + '</span>' : '<span style="font-size:11.5px"><b>' + left + '</b> / ' + a.cap + ' kursi</span>') + '</button>'; }
    return '<h1>Kuota dan kalender</h1><p class="sub">Klik tanggal untuk menutup atau membuka. Tanggal yang Anda tutup tidak dapat dipesan oleh tamu.</p>' +
      '<section class="pane" style="overflow:visible"><div class="cal-h"><h2>' + D.BULAN[first.getMonth()] + ' ' + first.getFullYear() + '</h2><span style="display:flex;gap:6px"><button class="icon-btn" id="qp" aria-label="Bulan lalu">' + ic('left', 18) + '</button><button class="icon-btn" id="qn" aria-label="Bulan depan">' + ic('right', 18) + '</button></span></div><div class="cal-g">' + cells + '</div><div class="legend"><span>' + ic('moon', 12) + ' Purnama atau tilem: umumnya tutup mengikuti kalender adat. Pembukaan manual belum tersedia pada versi demo</span></div></section>';
  }
  function vPendapatan(){
    const inc = income(), g = inc.cur;
    return '<h1>Pendapatan</h1><p class="sub">Pathora memotong komisi 12 persen dari setiap pesanan lunas. Tidak ada biaya bulanan.</p>' +
      '<div class="kpis"><div class="kpi"><small>Kotor bulan ini</small><b>' + rp(g) + '</b></div><div class="kpi"><small>Komisi 12%</small><b>' + rp(g * COMM) + '</b></div><div class="kpi"><small>Kamu terima</small><b>' + rp(g * (1 - COMM)) + '</b></div></div>' +
      '<section class="pane" style="margin-bottom:22px"><div class="pane-h"><h2>6 bulan terakhir (kotor)</h2></div><div class="pane-b">' + chart(inc) + '</div></section>' +
      '<section class="pane"><div class="pane-h"><h2>Dari pesanan pada prototipe ini</h2></div><div class="pane-b"><p class="muted">Pesanan yang Anda setujui dan dibayar tamu otomatis menambah angka bulan ini: <b>' + rp(inc.live) + '</b>.</p></div></section>';
  }
  function vProfil(){
    return '<h1>Profil host</h1><p class="sub">Informasi yang dilihat tamu sebelum memesan.</p><section class="pane"><div class="pane-b" style="display:grid;gap:16px;max-width:560px"><div class="field"><label>Nama komunitas</label><input class="input" id="pc" value="' + esc(HOST) + '"></div><div class="field"><label>Bahasa</label><input class="input" value="Indonesia, Bali, English"></div><div class="field"><label>Cerita singkat</label><textarea class="textarea" rows="4">Warga yang merawat telur penyu dan melepas tukik ke laut.</textarea></div><div class="field"><label>Kontribusi ke komunitas</label><textarea class="textarea" rows="2">Sebagian hasil kegiatan digunakan untuk pakan dan perawatan tukik.</textarea></div><button class="btn btn-primary" id="saveP" style="justify-self:start">Simpan</button></div></section>';
  }
  function render(){
    side();
    const m = document.getElementById('main');
    m.innerHTML = { ringkasan:vRingkasan, permintaan:vPermintaan, kegiatan:vKegiatan, kuota:vKuota, pendapatan:vPendapatan, profil:vProfil }[view]();
    const q = function(id){ return document.getElementById(id); };
    if (q('qp')) q('qp').onclick = function(){ const d = D.parse(calMonth); d.setMonth(d.getMonth() - 1); calMonth = D.iso(d).slice(0,7) + '-01'; render(); };
    if (q('qn')) q('qn').onclick = function(){ const d = D.parse(calMonth); d.setMonth(d.getMonth() + 1); calMonth = D.iso(d).slice(0,7) + '-01'; render(); };
    if (q('saveP')) q('saveP').onclick = function(){ PAUTH.update({ community: q('pc').value.trim() || HOST }); UI.toast('Profil disimpan'); };
    if (q('newAct')) q('newAct').onclick = newAct;
  }
  document.getElementById('main').addEventListener('click', function(e){
    const t = e.target;
    const v = t.closest('[data-v]'); if (v) { view = v.dataset.v; render(); return; }
    const ap = t.closest('[data-ap]'); if (ap) return decide(ap.dataset.ap, ap.dataset.src, true);
    const rj = t.closest('[data-rj]'); if (rj) return decide(rj.dataset.rj, rj.dataset.src, false);
    const q = t.closest('[data-q]'); if (q && MY.length) {
      const d = q.dataset.q, a = byId[MY[0]];
      if (isClosed(a, d, {}) ) { UI.toast('Tanggal ini tutup karena hari adat. Demo belum bisa membukanya.'); return; }
      PS.update(function(s){ const arr = s.hostClosed[a.id] = s.hostClosed[a.id] || []; const i = arr.indexOf(d); if (i >= 0) arr.splice(i,1); else arr.push(d); });
    }
  });
  function newAct(){
    UI.modal('<div class="modal-h"><h3>Tambah kegiatan</h3><button class="icon-btn" data-close aria-label="Tutup">' + ic('x', 18) + '</button></div><form class="modal-b" id="nf" style="display:grid;gap:14px"><div class="field"><label>Nama kegiatan</label><input class="input" name="name" required></div><div class="field"><label>Lokasi</label><input class="input" name="place" required></div><div class="field"><label>Harga per orang (Rp)</label><input class="input" type="number" name="price" min="10000" step="5000" required></div><p class="faint" style="font-size:12.5px">Setiap kegiatan baru ditinjau tim Pathora terlebih dahulu, terutama aspek etika dan keselamatan, sebelum ditayangkan.</p><button class="btn btn-primary btn-lg">Kirim untuk ditinjau</button></form>', function(ov, close){
      ov.querySelector('#nf').onsubmit = function(e){ e.preventDefault(); const f = e.target; PS.update(function(s){ s.seen.hostDrafts = (s.seen.hostDrafts || []).concat([{ name: f.name.value.trim(), place: f.place.value.trim(), price: +f.price.value }]); }); close(); UI.toast('Dikirim untuk ditinjau'); };
    });
  }
  PS.on(render);
  render();
})();
</script>
</body>
</html>
